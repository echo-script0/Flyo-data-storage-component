<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FYLO DATA STORAGE COMPONENT</title>
   <link rel="stylesheet" href="style.css" />
   <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
      <div class="left-container">
        <div class="top-left-container">               
          <img src="logo.svg" alt="logo">
        </div>
        
        <div class="bottom-left-container">
          <div class="blue-bg">
          <img src="icon-document.svg" alt="icon-document">
          </div>
          <div class="blue-bg">
          <img src="icon-folder.svg" alt="icon-folder">
          </div>
          <div class="blue-bg">
          <img src="icon-upload.svg" alt="icon-upload">
          </div>
        </div>
      </div>

      <div class="right-container">
        <div class="space">
        <div class="space-left" id=""><span class="big-text">185</span>GB LEFT</div>
        </div>
        <div class="you-have" id="">You've used<span class="number">815 GB</span>of your storage</div>
        <div class="line" id="">
          <div class="linear-gradient" id="">
            <div class="point" id=""></div>
          </div>
          <div class="under" id="">
          <div class="zero" id="">0 GB</div>
          <div class="thousand" id="">1000 GB</div>
          </div>
        </div>
      </div> 
    </main>
</body>
</html>
